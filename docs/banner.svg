<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="iPhone Location Simulator">
  <defs>
    <style>
      .t    { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title{ font-size: 46px; font-weight: 600; fill: #e8ebf0; letter-spacing: 0.3px; }
      .sub  { font-size: 20px; font-weight: 400; fill: #8a93a6; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#0d0f13"/>
  <rect x="0" y="0" width="1200" height="260" fill="none" stroke="#1d2129" stroke-width="2"/>
  <rect x="64" y="96" width="3" height="68" fill="#3b82f6"/>

  <text class="t title" x="92" y="130">iPhone Location Simulator</text>
  <text class="t sub"   x="92" y="166">GPS location simulation for iOS over Wi-Fi, from Windows</text>
  <text class="t" x="92" y="205" font-family="Consolas, monospace" font-size="14" fill="#5a6372">iOS 26 / 27 · pymobiledevice3 · GPL-3.0</text>

  <!-- simple pin outline -->
  <g transform="translate(1040,70)" fill="none" stroke="#2b3240" stroke-width="2.5">
    <path d="M60 10 C33 10 12 31 12 58 C12 95 60 150 60 150 C60 150 108 95 108 58 C108 31 87 10 60 10 Z"/>
    <circle cx="60" cy="56" r="20"/>
  </g>
  <circle cx="1100" cy="126" r="6" fill="#3b82f6"/>
</svg>
